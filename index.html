<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>TIME BRIDGE — Wholesale Stock</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1c1b19;--muted:#6d6a64;--line:#e3e0da;--accent:#2f4a3a;--chip:#efede8}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1d1d1b;--fg:#ecebe7;--muted:#a3a09a;--line:#2e2d2a;--accent:#9cc7ad;--chip:#262624}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.tools input,.tools select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.tools input{flex:1 1 180px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:0;background:var(--card);color:var(--fg);padding:7px 12px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--bg)}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.price{font-size:16px}.body{padding:8px 10px 10px}.ref{display:block}.row{flex-direction:column;align-items:flex-start;gap:2px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ph{aspect-ratio:1/1;background:var(--chip);display:block;width:100%;object-fit:cover}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.brand{font-weight:650}
.model{color:var(--muted);font-size:13px;min-height:1.3em}
.specs{font-size:12.5px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:6px}
.price{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.ref{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
footer{color:var(--muted);font-size:12.5px;padding:8px 16px 32px}
dialog{border:0;border-radius:14px;padding:0;max-width:min(960px,96vw);width:96vw;max-height:92vh;overflow:auto;background:var(--card);color:var(--fg)}
@media(max-width:520px){.viewer img{max-height:48vh}}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:760px){.dlg{grid-template-columns:3fr 2fr}}
.viewer{position:relative;background:#000}
.viewer img{display:block;width:100%;max-height:72vh;object-fit:contain}
.nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(0,0,0,.45);color:#fff;font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer}
.nav.l{left:8px}.nav.r{right:8px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--chip)}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.6;flex:none}
.thumbs img.on{opacity:1;outline:2px solid var(--accent)}
.info{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.info h2{margin:0;font-size:20px}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:4px 0;font-size:14px}
.info dt{color:var(--muted)}
.info dd{margin:0}
.close{position:absolute;top:8px;right:8px;border:0;background:rgba(0,0,0,.45);color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;z-index:2}
a.btn{display:inline-block;text-align:center;background:var(--accent);color:var(--bg);text-decoration:none;padding:9px 14px;border-radius:8px;font-weight:600}
.sec{font-size:16px;margin:4px 0 10px}
.sec .sub{font-weight:400}
#pickSec{margin-bottom:22px}
.badge{display:inline-block;font-size:11px;font-weight:650;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.b-new{background:var(--accent);color:var(--bg)}
.b-pick{background:#b5542d;color:#fff}
.b-res{background:#c62828;color:#fff}
.phw{position:relative}
.card.res .ph{filter:grayscale(1);opacity:.5}
.card.res .body{opacity:.6}
.ribbon{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);background:#c62828;color:#fff;text-align:center;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:6px 0}
.terms{margin:0 0 8px;padding-left:18px}
.terms li{margin:2px 0}
.note{font-size:13px;color:var(--muted);margin:4px 0}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>TIME BRIDGE — Wholesale Stock</h1>
  <div class="sub" id="sub"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search brand, model, ref…" aria-label="Search">
    <select id="brand" aria-label="Brand"><option value="">All brands</option></select>
    <select id="sort" aria-label="Sort">
      <option value="new">Newest</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option>
    </select>
    <div class="seg" id="cur" role="group" aria-label="Currency"></div>
  </div>
</div></header>
<main><div class="wrap"><section id="pickSec" hidden><h2 class="sec">Pick Up <span class="sub">— fixed clearance prices</span></h2><div class="grid" id="pgrid"></div></section><h2 class="sec" id="allH" hidden>All stock</h2><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>No items match.</div></div></main>
<footer><div class="wrap"><ul class="terms" id="terms"></ul>Wholesale prices per piece. Stock is updated every 30 minutes and items may sell on other channels without notice — please confirm availability with the reference number.</div></footer>
<dialog id="dlg"><div class="dlg">
  <div class="viewer"><button class="close" id="x" aria-label="Close">×</button>
    <img id="big" alt=""><button class="nav l" id="pv" aria-label="Previous">‹</button><button class="nav r" id="nx" aria-label="Next">›</button>
    <div class="thumbs" id="th"></div></div>
  <div class="info" id="info"></div>
</div></dialog>
<script>
var D = /*__DATA__*/null;
function __start(){
  var items = (D && D.items) || [], curs = (D && D.currencies) || ['USD'];
  var cur = curs[0];
  try { var saved = localStorage.getItem('ws_cur'); if (curs.indexOf(saved) >= 0) cur = saved; } catch (e) {}
  var SYM = { USD: '$', EUR: '€' };
  var img = function (id, w) { return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w; };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var money = function (it) { var v = it.prices && it.prices[cur]; return v ? (SYM[cur] || '') + Number(v).toLocaleString('en-US') + ' ' + cur : '—'; };
  var specs = function (it) { return [it.type === 'Pocket watch' ? 'Pocket watch' : '', it.movement, it.caseSize ? it.caseSize + ' mm' : '', it.caseMaterial, it.condition].filter(Boolean).join(' · '); };
  var when = D && D.builtAt ? new Date(D.builtAt) : null;
  document.getElementById('sub').textContent = (D && D.buyer ? 'Prepared for ' + D.buyer + ' · ' : '') + items.filter(function (it) { return !it.reserved; }).length + ' pieces available' + (when ? ' · updated ' + when.toLocaleString() : '');
  document.getElementById('terms').innerHTML = ((D && D.terms) || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('');

  var brands = {}; items.forEach(function (it) { if (it.brand) brands[it.brand] = 1; });
  var bsel = document.getElementById('brand');
  Object.keys(brands).sort(function (a, b) { return a.localeCompare(b); }).forEach(function (b) { var o = document.createElement('option'); o.value = b; o.textContent = b; bsel.appendChild(o); });

  var seg = document.getElementById('cur');
  function drawSeg() { seg.innerHTML = ''; curs.forEach(function (c) { var b = document.createElement('button'); b.textContent = c; b.className = c === cur ? 'on' : ''; b.setAttribute('aria-pressed', c === cur); b.onclick = function () { cur = c; try { localStorage.setItem('ws_cur', c); } catch (e) {} drawSeg(); draw(); }; seg.appendChild(b); }); }

  var grid = document.getElementById('grid'), empty = document.getElementById('empty');
  function draw() {
    var q = document.getElementById('q').value.trim().toLowerCase(), b = bsel.value, s = document.getElementById('sort').value;
    var list = items.filter(function (it) {
      if (b && it.brand !== b) return false;
      if (!q) return true;
      return [it.brand, it.model, it.sku, it.movement, it.caseMaterial].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    if (s !== 'new') list = list.slice().sort(function (x, y) { var a = (x.prices || {})[cur] || 0, c = (y.prices || {})[cur] || 0; return s === 'lo' ? a - c : c - a; });
    var isPick = function (it) { return it.tier === 'pickup' && !it.reserved; };
    var cap = cols() * ((D && D.pickRows) || 5);
    var pick = list.filter(isPick).sort(function (x, y) { return (x.pickRank || 1e9) - (y.pickRank || 1e9); }).slice(0, cap);
    var rest = list.filter(function (it) { return pick.indexOf(it) < 0; });
    rest = rest.filter(function (it) { return !it.reserved; }).concat(rest.filter(function (it) { return it.reserved; }));
    document.getElementById('pickSec').hidden = !pick.length;
    document.getElementById('allH').hidden = !pick.length;
    document.getElementById('pgrid').innerHTML = pick.map(card).join('');
    empty.hidden = list.length > 0;
    grid.innerHTML = rest.map(card).join('');
  }
  function cols() { var t = getComputedStyle(grid).gridTemplateColumns; return Math.max(1, t && t !== 'none' ? t.split(' ').filter(Boolean).length : 1); }
  var lastCols = 0;
  window.addEventListener('resize', function () { var c = cols(); if (c !== lastCols) { lastCols = c; draw(); } });
  function badge(it) { return it.reserved ? '<span class="badge b-res">Unavailable</span>' : it.tier === 'pickup' ? '<span class="badge b-pick">Pick Up</span>' : it.tier === 'new' ? '<span class="badge b-new">New</span>' : ''; }
  function card(it) {
      return '<div class="card' + (it.reserved ? ' res' : '') + '" tabindex="0" data-sku="' + esc(it.sku) + '">' +
        '<div class="phw"><img class="ph" loading="lazy" alt="' + esc(it.brand + ' ' + it.model) + '" src="' + img(it.images[0], 600) + '">' +
        (it.reserved ? '<span class="ribbon">Unavailable</span>' : '') + '</div>' +
        '<div class="body"><div class="brand">' + esc(it.brand || '—') + (it.reserved ? '' : badge(it)) + '</div><div class="model">' + esc(it.model) + '</div>' +
        '<div class="specs">' + esc(specs(it)) + '</div>' +
        '<div class="row"><span class="price">' + money(it) + '</span><span class="ref">Ref. ' + esc(it.sku) + '</span></div></div></div>';
  }
  ['q', 'brand', 'sort'].forEach(function (id) { document.getElementById(id).addEventListener(id === 'q' ? 'input' : 'change', draw); });
  var mainEl = document.querySelector('main');
  mainEl.addEventListener('click', function (e) { var c = e.target.closest('.card'); if (c) open(c.getAttribute('data-sku')); });
  mainEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { var c = e.target.closest('.card'); if (c) open(c.getAttribute('data-sku')); } });

  var dlg = document.getElementById('dlg'), big = document.getElementById('big'), th = document.getElementById('th'), cur_it = null, idx = 0;
  function show(i) { idx = (i + cur_it.images.length) % cur_it.images.length; big.src = img(cur_it.images[idx], 1600); Array.prototype.forEach.call(th.children, function (t, j) { t.className = j === idx ? 'on' : ''; }); }
  function open(sku) {
    cur_it = items.filter(function (x) { return x.sku === sku; })[0]; if (!cur_it) return;
    th.innerHTML = cur_it.images.map(function (id, j) { return '<img loading="lazy" alt="photo ' + (j + 1) + '" src="' + img(id, 160) + '">'; }).join('');
    Array.prototype.forEach.call(th.children, function (t, j) { t.onclick = function () { show(j); }; });
    var rows = [['Reference', cur_it.sku], ['Type', cur_it.type], ['Movement', cur_it.movement], ['Case', [cur_it.caseSize ? cur_it.caseSize + ' mm' : '', cur_it.caseMaterial].filter(Boolean).join(', ')],
                ['Condition', cur_it.condition], ['Gender', cur_it.gender], ['Strap', cur_it.band], ['Included', cur_it.accessories]].filter(function (r) { return r[1]; });
    var mail = D.contact ? '<a class="btn" href="mailto:' + esc(D.contact) + '?subject=' + encodeURIComponent('Inquiry Ref. ' + cur_it.sku + ' ' + cur_it.brand + ' ' + cur_it.model) + '">Inquire about this piece</a>' : '';
    if (cur_it.reserved) mail = '<p class="note">This piece is currently unavailable.</p>';
    else if (cur_it.tier === 'pickup') mail = '<p class="note">Pick Up · fixed price</p>' + mail;
    document.getElementById('info').innerHTML = '<h2>' + esc(cur_it.brand) + badge(cur_it) + '</h2><div class="model">' + esc(cur_it.model) + '</div>' +
      '<div class="price">' + money(cur_it) + '</div><dl>' + rows.map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>' + mail;
    show(0); dlg.showModal();
  }
  document.getElementById('x').onclick = function () { dlg.close(); };
  document.getElementById('pv').onclick = function () { show(idx - 1); };
  document.getElementById('nx').onclick = function () { show(idx + 1); };
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  document.addEventListener('keydown', function (e) { if (!dlg.open) return; if (e.key === 'ArrowLeft') show(idx - 1); if (e.key === 'ArrowRight') show(idx + 1); });
  drawSeg(); draw();
}
if (D) __start();
</script>
<script>
(async function () {
  if (D) return;
  var sub = document.getElementById("sub"), empty = document.getElementById("empty");
  var fail = function () { sub.textContent = ""; empty.hidden = false; empty.textContent = "This link is not valid or has expired."; };
  var m = location.hash.slice(1).match(/^([a-f0-9]{16})\.([A-Za-z0-9_-]{20,})$/);
  if (!m || !window.crypto || !crypto.subtle) return fail();
  sub.textContent = "Loading…";
  var b64 = function (s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var hk = function (k) { return crypto.subtle.importKey("raw", k, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]); };
  var sign = async function (k, d) { return new Uint8Array(await crypto.subtle.sign("HMAC", k, d)); };
  try {
    var r = null;
    for (var tries = 0; tries < 18; tries++) {
      r = await fetch("d/" + m[1] + ".json?t=" + Date.now(), { cache: "no-store" });
      if (r.ok || r.status !== 404) break;
      sub.textContent = "Preparing your catalog… it will appear automatically in a moment.";
      await new Promise(function (ok) { setTimeout(ok, 10000); });
    }
    if (!r || !r.ok) return fail();
    sub.textContent = "Loading…";
    var o = await r.json(), te = new TextEncoder();
    var k0 = await hk(b64(m[2]));
    var encKey = await hk(await sign(k0, te.encode("enc"))), macKey = await hk(await sign(k0, te.encode("mac")));
    var n = b64(o.n), c = b64(o.c), t = b64(o.t), nc = new Uint8Array(n.length + c.length);
    nc.set(n); nc.set(c, n.length);
    var t2 = await sign(macKey, nc);
    if (t2.length !== t.length || t2.some(function (v, i) { return v !== t[i]; })) return fail();
    var blocks = Math.ceil(c.length / 32), jobs = [];
    for (var b = 0; b < blocks; b++) { var mm = new Uint8Array(20); mm.set(n); new DataView(mm.buffer).setUint32(16, b); jobs.push(sign(encKey, mm)); }
    var ks = await Promise.all(jobs), out = new Uint8Array(c.length);
    for (var i = 0; i < c.length; i++) out[i] = c[i] ^ ks[i >> 5][i & 31];
    D = JSON.parse(new TextDecoder().decode(out));
    __start();
  } catch (e) { fail(); }
})();
</script>
</body>
</html>
